<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Descriptografar Cofre</title>
</head>
<body>
  <h2>Descriptografar Mensagens do Cofre</h2>

 <!-- <input type="file" id="fileInput" accept=".json" onchange="importarJSON(event)">-->
  <br><br>
 <label for="selecao">Digite o nome da mensagem:</label>
<input type="text" id="selecao" placeholder="Ex: segredo1">

  <br><br>
  <input id="senha2" placeholder="Digite a senha" type="text">
  <button onclick="descriptografar()">Descriptografar</button>

  <pre id="saida2"></pre>

  <script>
    let cofre = {};
    let caminhoArquivo = 'cofre.json';
	  
	  
	  
function carregarDadosJSON(caminhoArquivo) {
           fetch(caminhoArquivo)
            .then(response => {
               if (!response.ok) {
                throw new Error(`Erro ao carregar o arquivo: ${response.status}`);
           }
          return response.json();
           })
           .then(dados => {
            console.log("Dados carregados:", dados);
	    cofre = dados;
            
	  
      // Você pode manipular os dados aqui
         })
    .catch(erro => {
      console.error("Erro ao acessar o JSON:", erro);
    });
}

	  
	  
	  
	  
    function base64ParaBuffer(base64) {
      const bin = atob(base64);
      return Uint8Array.from(bin, c => c.charCodeAt(0));
    }

    async function gerarChave(senha, salt) {
      const enc = new TextEncoder();
      const chaveBase = await crypto.subtle.importKey(
        "raw", enc.encode(senha),
        { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey({
        name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"
      }, chaveBase, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    }

	  

    function importarJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        cofre = JSON.parse(e.target.result);
      };
      reader.readAsText(file);
    }


async function descriptografar() {
  try {
    const nome = document.getElementById("selecao").value.trim();
    const senha = document.getElementById("senha2").value;
    const item = cofre[nome];

    if (!item) {
      document.getElementById("saida2").textContent = `❌ Mensagem "${nome}" não encontrada no cofre.`;
      return;
    }

    if (!senha) {
      alert("Informe a senha.");
      return;
    }

    const salt = base64ParaBuffer(item.salt);
    const iv = base64ParaBuffer(item.iv);
    const data = base64ParaBuffer(item.data);
    const chave = await gerarChave(senha, salt);

    const decifrado = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, data);
    const dec = new TextDecoder();
    document.getElementById("saida2").textContent =
      `Mensagem "${nome}": ` + dec.decode(decifrado);
  } catch (e) {
    document.getElementById("saida2").textContent = "❌ Erro ao descriptografar (senha incorreta ou dados inválidos)";
  }
}

	  
	  carregarDadosJSON(caminhoArquivo);
  </script>
</body>
</html>
